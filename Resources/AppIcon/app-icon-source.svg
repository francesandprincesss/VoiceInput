<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F1F1"/>
    </linearGradient>

    <linearGradient id="centerBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2C2F30"/>
      <stop offset="100%" stop-color="#141617"/>
    </linearGradient>

    <linearGradient id="midBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#777B7D"/>
      <stop offset="100%" stop-color="#55595B"/>
    </linearGradient>

    <linearGradient id="outerBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7E8284"/>
      <stop offset="100%" stop-color="#64686A"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- app tile -->
  <rect x="32" y="32" width="960" height="960" rx="230" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- waveform -->
  <rect x="212" y="402" width="82" height="220" rx="41" fill="url(#outerBar)"/>
  <rect x="342" y="322" width="92" height="380" rx="46" fill="url(#midBar)"/>
  <rect x="464" y="232" width="96" height="560" rx="48" fill="url(#centerBar)"/>
  <rect x="590" y="322" width="92" height="380" rx="46" fill="url(#midBar)"/>
  <rect x="730" y="402" width="82" height="220" rx="41" fill="url(#outerBar)"/>
</svg>
